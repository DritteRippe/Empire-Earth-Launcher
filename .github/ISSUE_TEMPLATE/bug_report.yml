name: Bug report
description: Something does not work in the launcher or the mod creator
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. **Never attach game files, CD keys or the package itself.** Read logs and the
        diagnostics report before you post them.

        - A security problem? Please report it privately, see [SECURITY.md](https://github.com/DritteRippe/Empire-Earth-Launcher/security/policy).
        - A problem of a setup or of "Empire Earth Community Setup"? Please use the
          [setup repository](https://github.com/DritteRippe/Empire-Earth-Setup/issues).
  - type: dropdown
    id: component
    attributes:
      label: Program
      options:
        - Empire Earth Launcher
        - Mod creator
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of the launcher and of the package
      description: The version of the launcher and, if you installed it with it, of the package "Empire Earth Community".
      placeholder: "Launcher 1.1.0, package Empire Earth Community 1.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2, 64-bit"
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the relevant lines, or attach the file as `.txt` or `.log` (drag it into this box).

        - Launcher: the lines of `%LOCALAPPDATA%\Empire Earth Launcher\log.txt` around the problem, and the diagnostics
          report (Tools page, "Copy report" or "Save report...").
        - Suite installer or a setup started on its own: `%TEMP%\Setup Log <date> #<n>.txt` (if Windows asked for the
          password of an administrator account, it is in that account's `%TEMP%`).
        - Game setups started by the suite installer: `Logs\EE-<yyyyMMdd-HHmm>.log` and `Logs\NeoEE-<yyyyMMdd-HHmm>.log`
          in the folder of the suite (by default `C:\Program Files\Empire Earth Community\Logs`).
  - type: checkboxes
    id: owner
    attributes:
      label: Original game
      options:
        - label: I own the original game.
          required: true
